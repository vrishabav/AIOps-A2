apiVersion: batch/v1
kind: Job
metadata:
  name: validate-shards-job
spec:
  completions: 8
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: validate-shards
    spec:
      restartPolicy: Never
      containers:
        - name: validator
          image: shard-validator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "500m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
